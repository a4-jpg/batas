<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special</title>
<meta name="description" content="A personal greeting website.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating navigation -->
<nav class="nav" id="mainNav" aria-label="Section navigation">
  <a href="#hero">Home</a>
  <a href="#letter">Message</a>
  <a href="#gallery">Memories</a>
  <a href="#special">Special</a>
  <a href="#surprise">Surprise</a>
</nav>

<!-- ============ HERO ============ -->
<header class="hero" id="hero">
  <div class="hero-field">
    <canvas class="fx-layer" id="heroCanvas"></canvas>
  </div>
  <div class="hero-content">
    <span class="hero-kicker" id="heroKicker"></span>
    <h1 class="hero-title" id="heroTitle"></h1>
    <p class="hero-sub">A little corner of the internet made just for you.</p>
    <button class="btn hero-cta" id="heroButton"></button>
  </div>
  <div class="hero-scroll-hint" aria-hidden="true">↓ scroll</div>
</header>

<!-- ============ GREETING ============ -->
<section class="section greeting" id="greeting">
  <div class="container">
    <span class="eyebrow">A little hello</span>
    <h2 class="section-title" id="greetingTitle" style="margin:0 auto;"></h2>
    <hr class="greeting-divider">
    <p class="section-lede" id="greetingSubtitle" style="margin-left:auto;margin-right:auto;"></p>
  </div>
</section>

<!-- ============ LETTER ============ -->
<section class="section" id="letter">
  <div class="container letter-wrap">
    <div>
      <span class="eyebrow">Something I wanted to say</span>
      <h2 class="section-title">Read My Letter</h2>
    </div>
    <div class="letter" id="letterCard">
      <div class="letter-seal">
        <div class="letter-seal-mark" aria-hidden="true">✦</div>
        <p>A letter is waiting for you.</p>
        <br>
        <button class="btn" id="letterOpenBtn" aria-expanded="false" aria-controls="letterCard">Read My Letter 💌</button>
      </div>
      <div class="letter-body">
        <p class="letter-text" id="letterText"></p>
        <p class="letter-sign" id="letterSign"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============ MEMORY GALLERY ============ -->
<section class="section gallery" id="gallery">
  <div class="container">
    <span class="eyebrow">Look back with me</span>
    <h2 class="section-title" id="galleryTitle"></h2>
    <p class="section-lede" id="gallerySubtitle"></p>
    <div class="masonry" id="memoryGrid"></div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Memory viewer">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous memory">‹</button>
    <button class="lightbox-next" id="lightboxNext" aria-label="Next memory">›</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-text">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
      <p class="lightbox-desc" id="lightboxDesc"></p>
    </div>
  </div>
</div>

<!-- ============ COUNTER ============ -->
<section class="section counter" id="counter">
  <div class="container">
    <span class="eyebrow">Still counting</span>
    <h2 class="section-title" id="counterTitle" style="margin:0 auto;"></h2>
    <div class="counter-figures">
      <div class="counter-figure">
        <div class="counter-number" id="countYears">0</div>
        <div class="counter-label">years</div>
      </div>
      <div class="counter-figure">
        <div class="counter-number" id="countMonths">0</div>
        <div class="counter-label">months</div>
      </div>
      <div class="counter-figure">
        <div class="counter-number" id="countDays">0</div>
        <div class="counter-label">days</div>
      </div>
    </div>
    <p class="counter-footnote" id="counterFootnote"></p>
  </div>
</section>

<!-- ============ WHY YOU'RE SPECIAL ============ -->
<section class="section special" id="special">
  <div class="container">
    <span class="eyebrow">In case it needed saying</span>
    <h2 class="section-title" id="specialTitle"></h2>
    <div class="special-grid" id="specialGrid"></div>
  </div>
</section>

<!-- ============ SURPRISE ============ -->
<section class="section surprise" id="surprise">
  <div class="surprise-field">
    <canvas class="fx-layer" id="surpriseCanvas"></canvas>
  </div>
  <div class="container">
    <div class="surprise-prompt">
      <span class="eyebrow">Before you go</span>
      <h2 class="section-title" id="surprisePrompt" style="margin:0 auto;"></h2>
      <br>
      <button class="btn btn--ghost" id="surpriseBtn">Show Me 💛</button>
    </div>
    <div class="surprise-reveal">
      <p class="surprise-reveal-text" id="surpriseRevealText"></p>
    </div>
  </div>
</section>

<!-- ============ FINAL ============ -->
<section class="section final" id="final">
  <div class="container">
    <div id="finalLines"></div>
    <p class="final-sign" id="finalSign" style="white-space:pre-line;"></p>
  </div>
</section>

<!-- Music control -->
<button class="music-toggle" id="musicToggle" aria-label="Play music">🎵</button>
<audio id="bgAudio" loop>
  <source id="bgAudioSource" src="" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
